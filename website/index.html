<!DOCTYPE html>
<html>
<head>
    <title>Clock Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.410.0.min.js"></script>
	  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="container">
        <form id="clock-form">
            <div id="notice" class="alert alert-success mt-1 mb-1" role="alert"></div>
            <div class="dropdown-center">
              <div class="dropdown">
                <button
                  id="dropdown-button"
                  class="btn btn-lg btn-secondary dropdown-toggle" 
                  type="button" 
                  data-bs-toggle="dropdown" 
                  aria-expanded="false">
                  Seiko Watch
                </button>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="#" data-value="seiko-watch">
                      Seiko Watch
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#" data-value="hamilton-watch">
                      Hamilton Watch
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#" data-value="living-room-clock">
                      Living Room Clock
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#" data-value="bedroom-clock">
                      Bedroom Clock
                    </a>
                  </li>
                </ul>
              </div>
            </div>
            <div class="clock-digits">
                <div class="input-container">
                    <input type="number" id="hours" min="0" max="23" value="0">
                </div>
                <div class="input-container">
                    <label>:</label>
                    <input type="number" id="minutes" min="0" max="59" value="0">
                </div>
                <div class="input-container">
                    <label>:</label>
                    <input type="number" id="seconds" min="0" max="59" value="0">
                </div>
            <div>
            <div class="controls">
                <button id="record" type="button" class="btn btn-primary">Record</button>
                <button id="set" type="button" class="btn btn-secondary">Set</button>
            </div>
        </form>
        <table class="table">
          <thead>
            <tr>
              <th scope="col">Action</th>
              <th scope="col">Date</th>
              <th scope="col">Info</th>
            </tr>
          </thead>
          <tbody id="clock-records">
          </tbody>
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('hours').value = now.getHours();
            document.getElementById('minutes').value = now.getMinutes();
            document.getElementById('seconds').value = now.getSeconds();
        }
        updateTime();
        intervalId = setInterval(updateTime, 1000);

        var form = document.getElementById('clock-form');
        form.addEventListener('keydown', function() {
            clearInterval(intervalId);
        }, true);

        var clockID = "seiko-watch";
        document.querySelectorAll('.dropdown-item').forEach(function(item) {
            item.addEventListener('click', function(event) {
                document.getElementById('dropdown-button').innerHTML = this.textContent;

                clockID = event.target.getAttribute('data-value');
                renderDBRecords(clockID);

                const div = document.getElementById('clock-records');
                while (div.firstChild) {
                    div.removeChild(div.firstChild);
                }
            });
        });

        var buttons = document.querySelectorAll('.controls button');        
        buttons.forEach(function(button) {
            button.addEventListener('click', function(event) {
                event.preventDefault();
                saveToDB(event.target.id, clockID);
            });
        });

        renderDBRecords(clockID);
    </script>
</body>
</html>
