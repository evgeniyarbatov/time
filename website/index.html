<!DOCTYPE html>
<html>
<head>
    <title>Clock Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.410.0.min.js"></script>
    <script src="db.js"></script>
</head>
<body>
    <div class="container">
        <div id="notice"></div>
        <form id="clock-form">
            <select id="clock-id">
                <option value="seiko-watch">Seiko Watch</option>
                <option value="hamilton-watch">Hamilton Watch</option>
                <option value="living-room-clock">Living Room Clock</option>
                <option value="bedroom-clock">Bedroom Clock</option>
            </select>
            <div class="input-field">
                <label for="hours">Hours:</label>
                <input type="number" id="hours" min="0" max="23" value="0">
            </div>
            <div class="input-field">
                <label for="minutes">Minutes:</label>
                <input type="number" id="minutes" min="0" max="59" value="0">
            </div>
            <div class="input-field">
                <label for="seconds">Seconds:</label>
                <input type="number" id="seconds" min="0" max="59" value="0">
            </div>
            <button class="button" type="submit">Submit</button>
        </form>
        <div id="clock-records"></div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('hours').value = now.getHours();
            document.getElementById('minutes').value = now.getMinutes();
            document.getElementById('seconds').value = now.getSeconds();
        }
        updateTime();
        // Refresh the page every second with latest time
        intervalId = setInterval(updateTime, 1000);

        var form = document.getElementById('clock-form');
        form.addEventListener('keydown', function() {
            clearInterval(intervalId);
        }, true);
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            saveToDB();
            // Refresh the page to display what we saved
            setTimeout(function() {
                location.reload();
            }, 5000); 
        });

        const clockSelect = document.getElementById('clock-id');
        clockSelect.addEventListener('change', function() {
            // Remove earlier records we may have rendered
            const div = document.getElementById('clock-records');
            while (div.firstChild) {
                div.removeChild(div.firstChild);
            }
            renderDBRecords();
        });

        renderDBRecords();
    </script>
</body>
</html>
